  <rect width="1200" height="800" fill="url(#bg)"/>
  <path d="M0 630Q250 590 470 650T900 630t300 10v160H0Z" fill="#1b2a40"/>
  <g fill="none" stroke="#d9b978" stroke-width="7" opacity=".8"><rect x="470" y="230" width="260" height="250" rx="12"/><path d="M515 290h170M515 350h170M515 410h170M545 230v250M600 230v250M655 230v250"/><circle cx="600" cy="180" r="55"/><path d="M600 145v35l24 16"/></g>
